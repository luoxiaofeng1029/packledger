<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PackLedger</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PackLedger</p>
          <h1>Submission package builder</h1>
        </div>
        <div class="version" id="versionLabel">v0.1.0</div>
      </header>

      <main class="workspace">
        <section class="panel setup-panel" aria-label="Package setup">
          <div class="field-grid">
            <label class="wide">
              <span>Package template</span>
              <select id="templateSelect"></select>
            </label>
            <label>
              <span>Package title</span>
              <input id="titleInput" type="text" value="My submission package" />
            </label>
            <label>
              <span>Author</span>
              <input id="authorInput" type="text" placeholder="Your name" />
            </label>
            <label class="wide">
              <span>Note</span>
              <textarea id="noteInput" rows="4" placeholder="Optional note for reviewers or teammates"></textarea>
            </label>
          </div>

          <div class="drop-zone" id="dropZone">
            <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0-12 4.5 4.5M12 3 7.5 7.5M5 14.5V19h14v-4.5" />
            </svg>
            <div>
              <strong>Drop files or folders</strong>
              <span>Selected paths stay on this computer.</span>
            </div>
          </div>

          <div class="button-row">
            <button id="chooseFilesButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></svg>
              Add files
            </button>
            <button id="chooseFolderButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
              Add folder
            </button>
          </div>

          <div class="output-row">
            <label>
              <span>Output folder</span>
              <input id="outputInput" type="text" readonly placeholder="Choose a folder" />
            </label>
            <button id="chooseOutputButton" type="button" class="icon-button" title="Choose output folder" aria-label="Choose output folder">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7h14" /></svg>
            </button>
          </div>

          <div class="button-row actions">
            <button id="clearButton" type="button" class="secondary">Clear</button>
            <button id="createButton" type="button" class="primary" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5Z" /><path d="M8 9h8M8 13h5" /></svg>
              Build package
            </button>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="Package preview">
          <div class="stats">
            <div>
              <span>Files</span>
              <strong id="fileCount">0</strong>
            </div>
            <div>
              <span>Total size</span>
              <strong id="totalSize">0 B</strong>
            </div>
            <div>
              <span>Status</span>
              <strong id="statusText">Ready</strong>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Path</th>
                  <th>Size</th>
                  <th>SHA-256</th>
                </tr>
              </thead>
              <tbody id="fileRows">
                <tr class="empty-row">
                  <td colspan="3">No files selected.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="result" id="resultBox" hidden>
            <div>
              <span>Created package</span>
              <strong id="resultPath"></strong>
            </div>
            <button id="showResultButton" type="button">Show in folder</button>
          </div>
        </section>
      </main>
    </div>

    <script src="../shared/templates.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
